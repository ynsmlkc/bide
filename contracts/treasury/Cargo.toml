[package]
name = "bide-treasury"
version = "0.1.0"
edition = "2021"
description = "Bide treasury: records advertiser USDC deposits made with ft_transfer_call"
license = "MIT"
repository = "https://github.com/ynsmlkc/bide"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
